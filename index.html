    h=`<h3>Sesión de hoy · horas de inicio</h3><ol class="list">${ses.blocks.map((b,i)=>{const s=t;t+=b.min;return`<li class="${a.done[i]||a.skip[i]?'done':i===a.cur?'cur':''}"><span class="t">${hm(s)}</span><div class="grow" style="min-width:0"><div class="n">${esc(b.ex.n)}</div><div class="d">${b.det.join(' · ')}</div></div>${a.done[i]?`<span class="tag ok">${ic('check','s')}</span>`:a.skip[i]?'<span class="tag warn">saltado</span>':''}</li>`}).join('')}</ol>`}
  else if(sheet==='abort')h=`<h3>¿Cancelar la sesión?</h3><p class="small muted">No se guardará nada de hoy.</p><div class="row" style="flex-wrap:nowrap"><button class="btn line grow" data-act="close">Seguir</button><button class="btn grow" style="background:var(--bad);color:#fff" data-act="abort">Cancelar sesión</button></div>`;
  else if(sheet==='rules')h=`<h3>Claves para comer bien</h3><ul class="list">${[['sun','No te saltes el desayuno, sobre todo si entrenas.'],['drop','Agua siempre; refrescos y zumos, solo en los caprichos.'],['plate','Proteína en cada comida: huevo, pollo, pescado, legumbre o lácteo.'],['heart','Lácteos 3 veces al día: leche, yogur o queso suave.'],['star','2 piezas de fruta al día y verdura en comida y cena.'],['clock','Come sin prisa y sin pantallas; para cuando estés llena.']].map(([i,t])=>`<li><span class="bubble">${ic(i,'s')}</span><span class="small">${t}</span></li>`).join('')}</ul>`;
  else if(sheet==='startplan')h=`<h3>¿Empiezas tu plan?</h3><p class="small">Pulsa solo cuando ya puedas entrenar con normalidad. Empezarás en el nivel 1.</p><div class="row" style="flex-wrap:nowrap"><button class="btn line grow" data-act="close">Aún no</button><button class="btn pri grow" data-act="startplan">${ic('play','s')} Empezar</button></div>`;
  else if(sheet==='subj'){const sj=S.subj.find(x=>x.id===openSubj);if(sj){const t=S.term,g=S.grades.filter(x=>x.s===sj.id&&x.t===t);
    h=`<h3>${esc(sj.n)} · ${t}º trimestre</h3>
    <div class="tiles"><div class="tile"><b class="num">${nf(subjAvg(sj.id,t))}</b><span>media trimestre</span></div><div class="tile"><b class="num">${nf(subjAvg(sj.id))}</b><span>media curso</span></div><div class="tile"><b class="num">${g.length}</b><span>notas</span></div></div>
    <div class="tbl"><table><thead><tr><th>Tipo</th><th>Qué</th><th>Nota</th><th></th></tr></thead><tbody>${g.length?g.map(x=>`<tr><td>${x.k==='ex'?'Examen':'Trabajo'}</td><td>${esc(x.n||'—')}</td><td class="num"><b>${nf(x.v)}</b></td><td><button class="btn icon line" style="padding:6px" data-act="delgrade" data-v="${x.id}" aria-label="Borrar nota">${ic('x','s')}</button></td></tr>`).join(''):'<tr><td colspan="4" class="muted">Aún no hay notas este trimestre.</td></tr>'}</tbody></table></div>
    <div class="eyebrow">Añadir nota</div>
    <div class="seg mini" role="group" aria-label="Tipo de nota">${[['ex','Examen'],['tr','Trabajo']].map(([k,n])=>`<button data-act="gk" data-v="${k}" aria-pressed="${gk===k}">${n}</button>`).join('')}</div>
    <div class="row" style="flex-wrap:nowrap"><input class="inp" id="gname" type="text" maxlength="40" placeholder="Tema 3, proyecto…" style="flex:1;width:auto;min-width:0" aria-label="Qué es"><input class="inp num" id="gval" type="text" inputmode="decimal" autocomplete="off" pattern="[0-9]*[.,]?[0-9]*" placeholder="0–10" aria-label="Nota"></div>
    <button class="btn pri" data-act="addgrade">${ic('plus','s')} Guardar nota</button>
    <div class="eyebrow">Cuánto cuentan los exámenes</div>
    <div class="chips">${[30,40,50,60,70,80,100].map(w=>`<button class="chip" data-act="wset" data-v="${w}" aria-pressed="${sj.w===w}">${w} %</button>`).join('')}</div>
    <p class="small muted">Los trabajos cuentan el resto (${100-sj.w} %). Si en un trimestre solo hay de un tipo, cuenta ese.</p>
    ${tmHTML(sj)}
    <button class="btn ghost sm" data-act="delsubj" style="color:var(--bad)">${ic('trash','s')} ${confirmDel===sj.id?'Toca otra vez para quitarla':'Quitar asignatura'}</button>`}}
  else if(sheet==='addsubj')h=`<h3>Añadir asignatura</h3><input class="inp" id="sname" type="text" maxlength="40" style="width:100%" placeholder="Nombre" aria-label="Nombre de la asignatura"><div class="seg mini" role="group">${[[70,'Más exámenes'],[30,'Más trabajos']].map(([w,n])=>`<button data-act="sw" data-v="${w}" aria-pressed="${newW===w}">${n}</button>`).join('')}</div><button class="btn pri" data-act="addsubj">${ic('plus','s')} Añadir</button>`;
  else if(sheet==='addart')h=`<h3>Nuevo dibujo</h3><input class="inp" id="atitle" type="text" maxlength="40" style="width:100%" placeholder="Título" value="${esc(artTitle)}" aria-label="Título">
    <div class="eyebrow">Temática</div><div class="chips">${TEMAS.map(k=>`<button class="chip" data-act="atema" data-v="${k}" aria-pressed="${artTema===k}">${k}</button>`).join('')}</div>
    <div class="eyebrow">Estado</div><div class="seg mini" role="group">${ESTADOS.map(k=>`<button data-act="aest" data-v="${k}" aria-pressed="${artEst===k}">${k}</button>`).join('')}</div>
    <label class="btn line" for="aimg" style="cursor:pointer">${ic('img','s')} ${artImg?'Cambiar foto':'Añadir foto (opcional)'}</label><input id="aimg" class="vh" type="file" accept="image/*">
    ${artImg?`<img src="${artImg}" alt="Vista previa" style="max-height:170px;object-fit:contain;border-radius:12px">`:''}
    <button class="btn pri" data-act="addart">${ic('check','s')} Guardar dibujo</button>`;
  else if(sheet==='art'){const a=S.art.find(x=>x.id===openArt);if(a){const [y,m,d]=a.d.split('-');
    h=`<h3>${esc(a.title||'Sin título')}</h3>${a.img?`<img src="${a.img}" alt="${esc(a.title||'Dibujo')}" style="max-height:300px;object-fit:contain;border-radius:12px">`:''}
    <p class="small muted">${+d} de ${MNL[+m-1]} de ${y} · ${esc(a.tema)}</p>
    <div class="seg mini" role="group" aria-label="Estado">${ESTADOS.map(k=>`<button data-act="setest" data-v="${k}" aria-pressed="${a.est===k}">${k}</button>`).join('')}</div>
    <button class="btn ${a.fav?'line':'pri'}" data-act="artfav">★ ${a.fav?'Quitar de favoritos':'Añadir a favoritos'}</button>
    <button class="btn ghost sm" data-act="delart" style="color:var(--bad)">${ic('trash','s')} ${confirmDel===a.id?'Toca otra vez para borrarlo':'Borrar dibujo'}</button>`}}
  else if(sheet==='addnail')h=`<h3>Nuevo diseño de uñas</h3><input class="inp" id="atitle" type="text" maxlength="40" style="width:100%" placeholder="Nombre: french rosa, Halloween…" value="${esc(artTitle)}" aria-label="Nombre del diseño">
    <div class="eyebrow">¿Cuánto te gusta?</div><div class="chips">${[1,2,3,4,5].map(n=>`<button class="chip" data-act="nrate" data-v="${n}" aria-pressed="${nailRate===n}" aria-label="${n} de 5">${'★'.repeat(n)}</button>`).join('')}</div>
    <label class="btn line" for="aimg" style="cursor:pointer">${ic('img','s')} ${artImg?'Cambiar foto':'Añadir foto (opcional)'}</label><input id="aimg" class="vh" type="file" accept="image/*">
    ${artImg?`<img src="${artImg}" alt="Vista previa" style="max-height:170px;object-fit:contain;border-radius:12px">`:''}
    <button class="btn pri" data-act="addnail">${ic('check','s')} Guardar diseño</button>`;
  else if(sheet==='nail'){const n=S.nd.find(x=>x.id===openNail);if(n){h=`<h3>${esc(n.n||'Diseño')}</h3>${n.img?`<img src="${n.img}" alt="${esc(n.n||'Diseño de uñas')}" style="max-height:300px;object-fit:contain;border-radius:12px">`:''}<p class="small muted">${+n.d.slice(8)} de ${MNL[+n.d.slice(5,7)-1]}${n.rate?' · '+'★'.repeat(n.rate):''}</p>
    <button class="btn ghost sm" data-act="delnail" style="color:var(--bad)">${ic('trash','s')} ${confirmDel===n.id?'Toca otra vez para borrarlo':'Borrar diseño'}</button>`}}
  else if(sheet==='agadd')h=agAddHTML();
  else if(sheet==='agitem')h=agItemHTML();
  else if(sheet==='qadd')h=`<h3>¿Dónde lo guardo?</h3><p class="small muted" style="word-break:break-all">${esc(pendURL)}</p>${(SHOPS.test(pendURL)?[['wish','Ropa y accesorios'],['rec','Receta']]:[['rec','Receta'],['wish','Ropa y accesorios']]).map(([k,n],i)=>`<button class="btn ${i?'line':'pri'}" data-act="qto" data-v="${k}">${n}</button>`).join('')}`;
  else if(sheet==='alarms')h=alHTML();
  else if(sheet==='quick')h=quickHTML();
  else if(sheet==='otra')h=otraHTML();
  else if(sheet==='tema')h=temaHTML();
  else if(sheet==='editorial')h=edHTML();
  else if(sheet==='exadd')h=exAddHTML();
  else if(sheet==='citadd')h=citAddHTML();
  else if(sheet==='hoycfg')h=hoyCfgHTML();
  else if(sheet==='pomo')h=pomoHTML();
  else if(sheet==='gsearch')h=gsearchHTML();
  else if(sheet==='pinset')h=pinSetHTML();
  else if(sheet==='game')h=`<h3>Nuevo partido</h3><input class="inp" id="grival" type="text" maxlength="40" style="width:100%" placeholder="Rival" aria-label="Rival">
    <div class="seg mini" role="group" aria-label="Equipo">${['Club','Selección'].map(k=>`<button data-act="mteam" data-v="${k}" aria-pressed="${mTeam===k}">${k}</button>`).join('')}</div>
    <div class="row" style="flex-wrap:nowrap"><label class="grow small muted" for="gpts">Puntos<br><input class="inp num" id="gpts" type="number" inputmode="numeric" min="0" max="99" placeholder="0" style="width:100%"></label><label class="grow small muted" for="gmin">Minutos (opcional)<br><input class="inp num" id="gmin" type="number" inputmode="numeric" min="0" max="60" placeholder="–" style="width:100%"></label><label class="grow small muted" for="gdate">Fecha<br><input class="inp" id="gdate" type="date" value="${dk(new Date())}" style="width:100%;font-size:15px"></label></div>
    <div class="seg mini" role="group" aria-label="Resultado">${[[1,'Ganado'],[0,'Perdido']].map(([k,n])=>`<button data-act="mres" data-v="${k}" aria-pressed="${mRes===k}">${n}</button>`).join('')}</div>
    <button class="btn pri" data-act="addgame">${ic('check','s')} Guardar partido</button>`;
  else if(sheet==='form')h=formHTML();
  else if(sheet==='item')h=itemHTML();
  else if(sheet==='restore')h=`<h3>Restaurar copia</h3><label for="rest-in" class="small muted">Pega aquí la copia completa:</label><textarea id="rest-in"></textarea><button class="btn pri" data-act="restore">${ic('up','s')} Restaurar</button>`;
  L.innerHTML=`<div class="sheet" data-act="close-bg"><div class="pan" role="dialog" aria-modal="true">${h}${sheet!=='abort'&&sheet!=='startplan'?`<button class="btn line" data-act="close">Cerrar</button>`:''}</div></div>`}

function tickRest(){const el=document.getElementById('rt');const left=Math.ceil((restEnd-Date.now())/1000);if(!el){clearInterval(restIv);restIv=null;return}
  if(left<=0){el.innerHTML=ic('bolt','s')+' ¡Serie!';clearInterval(restIv);restIv=null;try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}return}el.innerHTML=ic('timer','s')+' '+left+' s'}
let wake=null;async function lock(){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act],[data-tab]');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;S.pre=false;confirmReset=false;sheet=null;render();return}
  const a=t.dataset.act,now=new Date(),tk=dk(now);
  if(a==='close-bg'){if(e.target===t){sheet=null;renderSheet()}return}
  if(a==='close'){sheet=null;renderSheet()}
  else if(a==='sheet'){sheet=t.dataset.s;renderSheet()}
  else if(a==='pre'){S.pre=true;tab='hoy';render()}
  else if(a==='nopre'){S.pre=false;render()}
  else if(a==='extra'){S.extraOpen=true;render()}
  else if(a==='startplan'){S.started=true;S.level=1;sheet=null;save();render();toast('¡Plan en marcha!')}
  else if(a==='start'){const base=now.getHours()*60+now.getMinutes();
    S.act={d:tk,n:S.ses.length,base,cur:0,done:[],skip:[]};S.pre=false;S.extraOpen=false;save();lock();render()}
  else if(a==='done'||a==='skip'){(a==='done'?S.act.done:S.act.skip)[S.act.cur]=true;S.act.cur++;restEnd=0;save();render()}
  else if(a==='rest'){restEnd=Date.now()+(+t.dataset.s)*1000;if(!restIv)restIv=setInterval(tickRest,250);tickRest()}
  else if(a==='view'){S.view=t.dataset.v;save();t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===t)))}
  else if(a==='abort'){S.act=null;sheet=null;save();render()}
  else if(a==='q'){SV[t.dataset.q]=+t.dataset.v;t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===t)))}
  else if(a==='survey'){const {rpe,comp,pain,en}=SV;
    if([rpe,comp,pain,en].includes(undefined)){document.getElementById('sv-msg').textContent='Contesta las 4 preguntas para guardar.';return}
    const ses=build(S.act.n),kc=Math.round(ses.blocks.reduce((s,b,i)=>s+(S.act.done[i]?b.kcal:0),0));
    S.ses.push({d:S.act.d,n:S.act.n,t:ses.tpl.n,l:S.level,kcal:kc,rpe,comp,pain,en});
    let d=0;if(pain>=2||comp===2||rpe===3)d=-1;else if(comp===0&&pain===0&&rpe<=1&&en>0)d=1;
    let nl=Math.max(1,Math.min(20,S.level+d)),msg,cls='ok';
    msg=d>0?`Subes al nivel ${nl}.`:d<0?`Bajamos al nivel ${nl}.`:`Sigues en el nivel ${nl}.`;
    if(pain===3){msg+=' Dolor en el tobillo: descansa y cuéntaselo a tu entrenador.';cls='bad'}
    else if(pain===2){msg+=' Si la molestia dura más de 2 días, cuéntaselo a tu entrenador.';cls='warn'}
    S.level=nl;S.last={d:tk,msg,cls};S.act=null;for(const k in SV)delete SV[k];save();try{wake&&wake.release()}catch(err){}render()}
  else if(a==='meal'){const cur=selMeals(tk),v=t.dataset.v;S.meal[tk]=cur.includes(v)?cur.filter(x=>x!==v):cur.concat([v]);save();render()}
  else if(a==='exc'){const m=t.dataset.m,i=S.exc.findIndex(e=>e.d===tk&&e.m===m);if(i>=0)S.exc.splice(i,1);else{if(weekExc(now).length>=2)toast('Ya llevas 2 caprichos esta semana');S.exc.push({d:tk,m})}save();render()}
  else if(a==='goal'){const v=parseFloat(String(document.getElementById('goalin').value).replace(',','.'));if(!(v>=60&&v<=77)){toast('Elige una meta entre 60 y 77 kg');return}S.goal=v;save();render();toast('Meta guardada')}
  else if(a==='mtab'){mealTab=t.dataset.v;render()}
  else if(a==='menu'){S.menu[tk]=S.menu[tk]||{};S.menu[tk][t.dataset.m]=t.dataset.v;save();render()}
  else if(a==='kg'){const v=parseFloat(String(document.getElementById('kgin').value).replace(',','.'));if(!(v>=35&&v<=150)){toast('Escribe tu peso en kg, por ejemplo 77,5');return}
    const i=S.kg.findIndex(x=>x.d===tk);if(i>=0)S.kg[i].w=v;else S.kg.push({d:tk,w:v});save();render();toast('Peso guardado')}
  else if(a==='skin'){S.skin=t.dataset.v;save();render()}
  else if(a==='day'){const d=+t.dataset.v,set=new Set(S.days);set.has(d)?set.delete(d):set.add(d);if(set.size<4||set.size>7){toast('Elige entre 4 y 7 días');return}S.days=[...set];save();render()}
    else if(a==='copy'){const s=JSON.stringify(S);navigator.clipboard.writeText(s).then(()=>toast('Copiada. Pégala en una nota.'),()=>{sheet='restore';renderSheet();const ta=document.getElementById('rest-in');ta.value=s;ta.select();toast('Selecciona el texto y cópialo')})}
  else if(a==='restore'){try{const o=JSON.parse(document.getElementById('rest-in').value);if(o&&o.v===1){S=o;sheet=null;save();render();toast('Copia restaurada')}else throw 0}catch(err){toast('La copia no es válida')}}
  else if(a==='term'){S.term=+t.dataset.v;save();render()}
  else if(a==='subj'){openSubj=t.dataset.v;confirmDel=null;sheet='subj';renderSheet()}
  else if(a==='gk'){gk=t.dataset.v;t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===t)))}
  else if(a==='addgrade'){const v=parseFloat(String(document.getElementById('gval').value).replace(',','.'));if(!(v>=0&&v<=10)){toast('Escribe una nota entre 0 y 10');return}
    S.grades.push({id:'g'+Date.now(),s:openSubj,t:S.term,k:gk,n:document.getElementById('gname').value.trim(),v,d:tk});save();render();toast('Nota guardada')}
  else if(a==='delgrade'){S.grades=S.grades.filter(x=>x.id!==t.dataset.v);save();render()}
  else if(a==='wset'){const sj=S.subj.find(x=>x.id===openSubj);if(sj){sj.w=+t.dataset.v;save();render()}}
  else if(a==='delsubj'){if(confirmDel!==openSubj){confirmDel=openSubj;renderSheet();return}S.subj=S.subj.filter(x=>x.id!==openSubj);S.grades=S.grades.filter(x=>x.s!==openSubj);confirmDel=null;sheet=null;save();render();toast('Asignatura quitada')}
  else if(a==='sw'){newW=+t.dataset.v;t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===t)))}
  else if(a==='addsubj'){const n=document.getElementById('sname').value.trim();if(!n){toast('Escribe el nombre');return}S.subj.push({id:'s'+Date.now(),n,w:newW});sheet=null;save();render();toast('Asignatura añadida')}
  else if(a==='nailseen'){S.nail[monthKey(now)]=1;save();render()}
  else if(a==='artby'){artBy=t.dataset.v;render()}
  else if(a==='newart'){artTitle='';artImg=null;sheet='addart';renderSheet()}
  else if(a==='atema'||a==='aest'){if(a==='atema')artTema=t.dataset.v;else artEst=t.dataset.v;t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===t)))}
  else if(a==='addart'){artTitle=document.getElementById('atitle').value.trim();S.art.push({id:'a'+Date.now(),d:tk,title:artTitle,tema:artTema,est:artEst,img:artImg});
    if(!save()){S.art.pop();return}artTitle='';artImg=null;sheet=null;render();toast('Dibujo guardado')}
  else if(a==='openart'){openArt=t.dataset.v;confirmDel=null;sheet='art';renderSheet()}
  else if(a==='setest'){const x=S.art.find(z=>z.id===openArt);if(x){x.est=t.dataset.v;save();render()}}
  else if(a==='delart'){if(confirmDel!==openArt){confirmDel=openArt;renderSheet();return}S.art=S.art.filter(z=>z.id!==openArt);confirmDel=null;sheet=null;save();render();toast('Dibujo borrado')}
  else if(a==='en'){S.en[tk]=S.en[tk]||{};S.en[tk][t.dataset.k]=+t.dataset.v;save();render()}
  else if(a==='slp'){S.en[tk]=S.en[tk]||{};const e=S.en[tk];e.h=Math.max(3,Math.min(13,(e.h==null?8:e.h)+(e.h==null?0:+t.dataset.v)));save();render()}
  else if(a==='newgame'){mRes=null;sheet='game';renderSheet()}
  else if(a==='mteam'||a==='mres'){if(a==='mteam')mTeam=t.dataset.v;else mRes=+t.dataset.v;t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===t)))}
  else if(a==='addgame'){const p=parseInt(document.getElementById('gpts').value,10),m=parseInt(document.getElementById('gmin').value,10),d=document.getElementById('gdate').value||tk;if(!(p>=0&&p<=99)){toast('Escribe tus puntos, por ejemplo 12');return}
    S.games.push({id:'m'+Date.now(),d,r:document.getElementById('grival').value.trim(),t:mTeam,p,m:m>0?m:null,w:mRes});sheet=null;save();render();toast('Partido guardado')}
  else if(a==='delgame'){S.games=S.games.filter(g=>g.id!==t.dataset.v);save();render()}
  else if(a==='fsub'){foodSub=t.dataset.v;render()}
  else if(a==='osub'){ocioSub=t.dataset.v;render()}
  else if(a==='form'){formT=t.dataset.v;pickT=formT==='book'?'Quiero leer':null;sheet='form';renderSheet()}
  else if(a==='pick'){pickT=t.dataset.v;t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===t)))}
  else if(a==='paste'){const f=document.getElementById('furl');try{navigator.clipboard.readText().then(v=>{f.value=v.trim()},()=>{f.focus();toast('Mantén pulsado el campo y elige Pegar')})}catch(err){f.focus();toast('Mantén pulsado el campo y elige Pegar')}}
  else if(a==='save'){const k=t.dataset.v,g=id=>{const e=document.getElementById(id);return e?e.value.trim():''},u=(g('furl').match(/https?:\/\/\S+/)||[''])[0],n=g('fn');
