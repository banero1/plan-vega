:root{

const BIKEH={n:'Intervalos en bici',g:'cardio',p:'bikef',w:0,cue:'8 veces: 20 s fuerte y 40 s suave. Termina con 2 min suaves.',key:'Fuerte = esfuerzo 8 de 10. Suave = recuperar.',err:'Encorvar la espalda: pon el manillar alto.'};

const COOL={n:'Estiramientos suaves',g:'cool',p:'kneechest',w:0,cue:'Rodillas al pecho, isquios tumbado boca arriba y pecho en el marco de la puerta.',key:'30 s cada uno, respirando y sin rebotes.',err:'Estirar con dolor o doblar el tronco de golpe.'};

const HL={tobillo:['sh'],pecho:['to','ua'],espalda:['to','ua'],dpost:['ua'],hombro:['ua'],triceps:['ua'],biceps:['ua','fa'],cuad:['th'],gluteo:['th','to'],isquio:['th'],gemelo:['sh'],core:['to'],cardio:['th','sh'],warm:['th','sh'],cool:[]};

const POOL={pecho:['pb','pi','ap','fb','pn'],espalda:['r1','rc','po','rn'],dpost:['pj','ye'],hombro:['ps','el','ef','pa'],triceps:['ex','pt','ec','pc'],biceps:['ca','cm','cc','ci'],cuad:['sg','zs','sw','ss'],gluteo:['pg','ht','pu','ab'],isquio:['cf','pe'],tobillo:['eu','eb','gp','es','et'],core:['pf','pl','bd','db','gr','pm','lc','dm']};
const TPL=[
 {n:'Pierna y tobillo',m:'Cuádriceps, glúteo, isquios y tobillos',g:['cuad','gluteo','isquio','tobillo','tobillo']},
 {n:'Empuje y core',m:'Pecho, hombro, tríceps y abdomen',g:['pecho','hombro','triceps','core','core']},
 {n:'Resistencia',m:'Bici a intervalos, tobillo, glúteo y core',g:['cardio','tobillo','gluteo','core','core']},
 {n:'Tirón y core',m:'Espalda, hombro posterior, bíceps y abdomen',g:['espalda','espalda','dpost','biceps','core']},
 {n:'Cuerpo completo',m:'Pierna, pecho, espalda, tobillo y core',g:['cuad','pecho','espalda','tobillo','core']}];
const USES={};TPL.forEach(t=>t.g.forEach(g=>USES[g]=(USES[g]||0)+1));
function pick(c){const cnt={};return TPL.map(t=>t.g.map(g=>{if(g==='cardio')return'bk';cnt[g]=(cnt[g]||0)+1;const p=POOL[g];return p[(c*USES[g]+cnt[g]-1)%p.length]}))}

const LNAME=L=>L<=4?'Base':L<=8?'Adaptación':L<=12?'Desarrollo':L<=16?'Fuerza':'Rendimiento';
function LP(L){return{sets:L<=3?2:L<=9?3:4,reps:10+((L-1)%3)*2,rest:Math.max(45,90-(L-1)*3),sec:Math.min(60,20+L*2),step:Math.floor((L-1)/3),met:L<=4?3.5:L<=12?5:6,rpe:L<=4?6:L<=12?7:8}}
function wkg(e,L){const b=Math.max(2.5,Math.round(e.w*.6/2.5)*2.5);return Math.min(15,Math.round(b*(1+LP(L).step*.25)/2.5)*2.5)}
function build(n){
  const L=S.level,P=LP(L),tpl=TPL[n%5],ids=pick(Math.floor(n/5))[n%5],w=curW();
  let rest=P.rest,cut=0;
  const make=()=>{const b=[{k:'warm',ex:WARM,min:5,met:5.5,det:['5 min','suave']}];
    ids.forEach(id=>{
      if(id==='bk'){const hi=L>=3;b.push({k:'cardio',ex:hi?BIKEH:BIKEM,min:10,met:hi?8:5.5,det:hi?['8 × 20 s fuerte','40 s suave']:['10 min','esfuerzo 5-6']});return}
      const e=EX[id],sets=Math.max(2,P.sets-cut),per=e.side?2:1,tsec=(e.id==='gr'||e.id==='gp')?Math.min(60,30+L*2):P.sec;
      const work=(e.t==='time'?tsec:P.reps*4)*per,kg=e.w?wkg(e,L):0,reps=e.t==='time'?tsec+' s':P.reps+' rep';
      b.push({k:'ex',ex:e,sets,reps,kg,rest,min:sets*(work+rest)/60,met:P.met,det:[`${sets} × ${reps}${e.side?' /lado':''}`].concat(kg?[f1(kg)+' kg']:[]).concat([`desc. ${rest} s`])})});
    b.push({k:'cool',ex:COOL,min:5,met:2.3,det:['5 min','sin rebotes']});return b};
  let bl=make(),tot=bl.reduce((a,x)=>a+x.min,0);
  while(tot>45&&(rest>45||cut<2)){if(rest>45)rest-=5;else cut++;bl=make();tot=bl.reduce((a,x)=>a+x.min,0)}
  bl.forEach(x=>x.kcal=x.min*x.met*3.5*w/200);
  return{n,tpl,blocks:bl,min:tot,kcal:bl.reduce((a,x)=>a+x.kcal,0),rpe:P.rpe}
}

    if(W.pending>0&&W.done.length<7)out+=hero('Pendiente','recuperación')}
  else if(planned||W.pending>0)out+=hero(planned?'Hoy toca':'Pendiente',planned?'':'recuperación');
  else{out+=`<div class="card"><div class="row" style="flex-wrap:nowrap"><span class="bubble">${ic('moon')}</span><div class="grow"><div class="eyebrow">Hoy</div><h3>Día de descanso</h3><p class="small muted">${W.done.length} de ${S.days.length} sesiones esta semana</p></div></div>${W.done.length<7&&!S.extraOpen?`<button class="btn line block" data-act="extra">${ic('star','s')} Hacer un día extra</button>`:''}</div>`;
    if(S.extraOpen)out+=hero('Día extra','extra')}

function vSession(){const a=S.act,ses=build(a.n);

function vProg(){const w=curW(),start=S.kg[0].w,tot=S.ses.reduce((a,s)=>a+s.kcal,0),C=2*Math.PI*36;

  const pts=S.kg.slice(-20),ys=pts.map(p=>p.w).concat(G?[G]:[]),mn=Math.floor(Math.min(...ys))-1,mx=Math.ceil(Math.max(...ys))+1;

  return`<div class="card"><div class="row" style="flex-wrap:nowrap"><div class="ring"><svg viewBox="0 0 86 86"><circle cx="43" cy="43" r="36" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="43" cy="43" r="36" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*S.level/20} ${C}"/></svg><b>${S.level}</b></div>
   <div class="grow"><div class="eyebrow">${ic('star','s')} Estado de forma</div><h3>${LNAME(S.level)}</h3><p class="small muted">Nivel ${S.level} de 20${S.started?'':' · empieza al activar el plan'}</p></div></div><div class="ladder">${lad}</div></div>
  <div class="card"><div class="eyebrow">${ic('scale','s')} Peso · ${G?'meta '+f1(G)+' kg':'marca tu meta'}</div>
   <div class="tiles"><div class="tile"><b class="num">${f1(w)}</b><span>kg ahora</span></div><div class="tile"><b class="num" style="color:var(--ok)">${f1(start-w)}</b><span>perdidos</span></div><div class="tile"><b class="num">${G?f1(Math.max(0,w-G)):'–'}</b><span>por bajar</span></div></div>${sp}
   <div class="row" style="flex-wrap:nowrap"><input class="inp num" type="number" id="kgin" step="0.1" min="50" max="200" inputmode="decimal" placeholder="${f1(w)}" aria-label="Peso de hoy en kg"><button class="btn pri sm grow" data-act="kg">${ic('check','s')} Guardar peso semanal</button></div>
   <div class="row" style="flex-wrap:nowrap"><input class="inp num" type="number" id="goalin" step="0.5" min="60" max="77" inputmode="decimal" placeholder="${G?f1(G):'meta'}" aria-label="Peso objetivo en kg"><button class="btn line sm grow" data-act="goal">${ic('target','s')} ${G?'Cambiar mi meta':'Marcar mi meta'}</button></div></div>

  else if(a==='sheet'){sheet=t.dataset.s;renderSheet()}
  else if(a==='pre'){S.pre=true;render()}
  else if(a==='nopre'){S.pre=false;render()}
  else if(a==='extra'){S.extraOpen=true;render()}
  else if(a==='startplan'){S.started=true;S.level=1;sheet=null;save();render();toast('¡Plan en marcha!')}
  else if(a==='start'){const base=now.getHours()*60+now.getMinutes();
    S.act={d:tk,n:S.ses.length,base,cur:0,done:[],skip:[]};S.pre=false;S.extraOpen=false;save();lock();render()}
  else if(a==='done'||a==='skip'){(a==='done'?S.act.done:S.act.skip)[S.act.cur]=true;S.act.cur++;restEnd=0;save();render()}
  else if(a==='rest'){restEnd=Date.now()+(+t.dataset.s)*1000;if(!restIv)restIv=setInterval(tickRest,250);tickRest()}
  else if(a==='view'){S.view=t.dataset.v;save();t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===t)))}
  else if(a==='abort'){S.act=null;sheet=null;save();render()}
  else if(a==='q'){SV[t.dataset.q]=+t.dataset.v;t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===t)))}
  else if(a==='survey'){const {rpe,comp,pain,en}=SV;
    if([rpe,comp,pain,en].includes(undefined)){document.getElementById('sv-msg').textContent='Contesta las 4 preguntas para guardar.';return}
    const ses=build(S.act.n),kc=Math.round(ses.blocks.reduce((s,b,i)=>s+(S.act.done[i]?b.kcal:0),0));
    S.ses.push({d:S.act.d,n:S.act.n,t:ses.tpl.n,l:S.level,kcal:kc,rpe,comp,pain,en});
    let d=0;if(pain>=2||comp===2||rpe===3)d=-1;else if(comp===0&&pain===0&&rpe<=1&&en>0)d=1;
    let nl=Math.max(1,Math.min(20,S.level+d)),msg,cls='ok';
    msg=d>0?`Subes al nivel ${nl}.`:d<0?`Bajamos al nivel ${nl}.`:`Sigues en el nivel ${nl}.`;
    if(pain===3){msg+=' Dolor en el tobillo: descansa y cuéntaselo a tu entrenador.';cls='bad'}
    else if(pain===2){msg+=' Si la molestia dura más de 2 días, cuéntaselo a tu entrenador.';cls='warn'}
    S.level=nl;S.last={d:tk,msg,cls};S.act=null;for(const k in SV)delete SV[k];save();try{wake&&wake.release()}catch(err){}render()}
  else if(a==='meal'){const cur=selMeals(tk),v=t.dataset.v;S.meal[tk]=cur.includes(v)?cur.filter(x=>x!==v):cur.concat([v]);save();render()}
  else if(a==='exc'){const m=t.dataset.m,i=S.exc.findIndex(e=>e.d===tk&&e.m===m);if(i>=0)S.exc.splice(i,1);else{if(weekExc(now).length>=2)toast('Ya llevas 2 caprichos esta semana');S.exc.push({d:tk,m})}save();render()}
  else if(a==='goal'){const v=parseFloat(String(document.getElementById('goalin').value).replace(',','.'));if(!(v>=60&&v<=77)){toast('Elige una meta entre 60 y 77 kg');return}S.goal=v;save();render();toast('Meta guardada')}
  else if(a==='mtab'){mealTab=t.dataset.v;render()}
  else if(a==='menu'){S.menu[tk]=S.menu[tk]||{};S.menu[tk][t.dataset.m]=+t.dataset.v;save();t.parentElement.querySelectorAll('.mc').forEach(b=>b.setAttribute('aria-pressed',String(b===t)))}
  else if(a==='kg'){const v=parseFloat(String(document.getElementById('kgin').value).replace(',','.'));if(!(v>=35&&v<=150)){toast('Escribe tu peso en kg, por ejemplo 77,5');return}
    const i=S.kg.findIndex(x=>x.d===tk);if(i>=0)S.kg[i].w=v;else S.kg.push({d:tk,w:v});save();render();toast('Peso guardado')}
  else if(a==='skin'){S.skin=t.dataset.v;save();render()}
  else if(a==='day'){const d=+t.dataset.v,set=new Set(S.days);set.has(d)?set.delete(d):set.add(d);if(set.size<4||set.size>7){toast('Elige entre 4 y 7 días');return}S.days=[...set];save();render()}
    else if(a==='copy'){const s=JSON.stringify(S);navigator.clipboard.writeText(s).then(()=>toast('Copiada. Pégala en una nota.'),()=>{sheet='restore';renderSheet();const ta=document.getElementById('rest-in');ta.value=s;ta.select();toast('Selecciona el texto y cópialo')})}
  else if(a==='restore'){try{const o=JSON.parse(document.getElementById('rest-in').value);if(o&&o.v===1){S=o;sheet=null;save();render();toast('Copia restaurada')}else throw 0}catch(err){toast('La copia no es válida')}}
  else if(a==='reset'){if(confirmReset){S=fresh();save();confirmReset=false;toast('Datos borrados')}else confirmReset=true;render()}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.act)lock()});
load();render();
</script>
